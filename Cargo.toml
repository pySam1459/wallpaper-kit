[package]
name = "scene-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "An embeddable Windows background renderer"
autoexamples = false

[dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

[dev-dependencies]
png = "=0.18.1"
serde_json = "=1.0.151"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[[example]]
name = "native-viewer"
path = "examples/native-viewer/main.rs"

[[example]]
name = "headless"
path = "examples/headless/main.rs"

[[example]]
name = "motion-checks"
path = "examples/motion-checks/main.rs"
test = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
