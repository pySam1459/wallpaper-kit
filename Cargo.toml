[package]
name = "wallpaper-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "An embeddable Windows background renderer"
autoexamples = false

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
lz4_flex = { version = "=0.12.1", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

[dev-dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[[example]]
name = "native-viewer"
path = "examples/native-viewer/main.rs"
test = true

[[example]]
name = "headless"
path = "examples/headless/main.rs"

[[example]]
name = "scene-inspect"
path = "examples/scene-inspect/main.rs"

[[example]]
name = "texture-checks"
path = "examples/texture-checks/main.rs"

[[example]]
name = "motion-checks"
path = "examples/motion-checks/main.rs"
test = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
